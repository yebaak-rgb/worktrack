<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>업무 트래킹</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="업무 트래킹">
<meta name="theme-color" content="#3b63f3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --line:#e6e8ef; --text:#23272f; --sub:#7a8194;
  --accent:#3b63f3; --accent-soft:#eef2ff; --danger:#e5484d; --ok:#2f9e6e;
  --warn:#f5a623; --radius:14px; --shadow:0 1px 3px rgba(20,30,60,.06);
  --side-w:196px; --memo-w:300px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none;width:100%;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;
  background:var(--accent);color:#fff;transition:opacity .15s;}
.btn:hover{opacity:.88;}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line);}
.btn.soft{background:var(--accent-soft);color:var(--accent);}
.btn.danger{background:#fdecec;color:var(--danger);}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px;}
.hidden{display:none !important;}
.muted{color:var(--sub);font-size:13px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* ===== 인증 화면 ===== */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  width:100%;max-width:420px;padding:34px 30px;}
.auth-card h1{font-size:22px;margin:0 0 6px;}
.auth-card p.sub{color:var(--sub);font-size:13.5px;margin:0 0 22px;}
.auth-card label{font-size:13px;font-weight:600;color:var(--sub);display:block;margin:14px 0 5px;}
.auth-msg{font-size:13px;margin-top:12px;min-height:18px;}
.auth-msg.err{color:var(--danger);} .auth-msg.ok{color:var(--ok);}

/* ===== 3단 레이아웃: 사이드바 | 메인 | 메모 ===== */
#app{display:grid;grid-template-columns:var(--side-w) 1fr var(--memo-w);height:100vh;}
.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto;}
.sidebar .logo{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;padding:4px 10px 16px;}
.sidebar .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.snav{border:none;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;
  font-size:14.5px;font-weight:600;color:var(--sub);cursor:pointer;display:flex;gap:9px;align-items:center;white-space:nowrap;}
.snav:hover{background:var(--bg);color:var(--text);}
.snav.active{background:var(--accent);color:#fff;}
.sidebar .sep{height:1px;background:var(--line);margin:10px 6px;}
.sidebar .grow{flex:1;}
.main-area{overflow-y:auto;padding:20px 22px 90px;}
.main-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.main-head h2{font-size:19px;margin:0;}
.main-head .spacer{flex:1;}
.today-label{color:var(--sub);font-size:13.5px;}

/* ===== 메모 패널 (우측 고정) ===== */
.memo-panel{background:#fffdf3;border-left:1px solid #efe8c8;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;}
.memo-panel h3{margin:0;font-size:15px;display:flex;align-items:center;gap:7px;}
.memo-close{display:none;margin-left:auto;font-size:16px;}
.memo-panel .add-box{display:flex;gap:6px;}
.memo-tabs{display:flex;gap:4px;}
.memo-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 4px;
  font-size:12.5px;font-weight:600;color:var(--sub);cursor:pointer;}
.memo-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
/* 거래처 카테고리 탭 — 글자 길이에 맞춰 넓게, 줄바꿈 방지 */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.cat-tabs button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:7px 16px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;}
.cat-tabs button:hover{border-color:var(--accent);color:var(--accent);}
.cat-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.chip.cat-p{background:#e8f6ef;color:var(--ok);}
.chip.cat-w{background:var(--accent-soft);color:var(--accent);}
.memo-panel .add-box input{background:#fff;font-size:14px;}
.memo-card{background:#fffbe8;border:1px solid #f0e6bb;border-radius:12px;padding:11px 12px;}
.memo-card.pinned{background:#fff3f0;border-color:#f3cfc4;}
/* 메모 아코디언: 접힘=첫 줄만, 펼침=전체 */
.memo-card .m-row{display:flex;align-items:flex-start;gap:6px;cursor:pointer;}
.memo-card .m-caret{color:var(--sub);font-size:10px;margin-top:4px;flex:none;transition:transform .15s;}
.memo-card.expanded .m-caret{transform:rotate(90deg);}
.memo-card .content{flex:1;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.memo-card.expanded .content{white-space:pre-wrap;word-break:break-word;}
.memo-card .meta{font-size:11px;color:var(--sub);margin-top:7px;display:none;justify-content:space-between;align-items:center;}
.memo-card.expanded .meta{display:flex;}
.icon-btn{border:none;background:transparent;color:var(--sub);cursor:pointer;font-size:15px;padding:3px;}
.icon-btn:hover{color:var(--text);}
#memoToggle{display:none;position:fixed;right:18px;bottom:86px;z-index:60;width:52px;height:52px;border-radius:50%;
  border:none;background:#f7c948;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;}

/* ===== 카드 공통 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
.card h3{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.card h3 .mini{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;}

/* ===== 대시보드 ===== */
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
.dash-grid .full{grid-column:1/-1;}
/* 대시보드: 상(월간|오늘할일) / 주간(전체너비) / 하(마감|회의) */
.dash-top{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start;}
.dash-bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
/* 대시보드 월간(제목 표시) */
.dash-month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.dash-month .dmdow{text-align:center;font-size:11.5px;color:var(--sub);font-weight:700;padding:2px 0;}
.dash-month .dmcell{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;cursor:pointer;font-size:11px;overflow:hidden;}
.dash-month .dmcell:hover{border-color:var(--accent);}
.dash-month .dmcell.dim{opacity:.4;}
.dash-month .dmcell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.dash-month .dmcell.off{background:#fbf6ec;}
.dash-month .dmnum{font-weight:700;font-size:12px;margin-bottom:2px;}
.dash-month .dmcell.today .dmnum{color:var(--accent);}
.dash-month .dmt{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45;}
.dash-month .dmt.done{background:#eef3ef;color:var(--sub);text-decoration:line-through;}
.dash-month .dmt-meet{background:#f1e9ff;color:#5b3aa8;}
.dash-month .dmt-shared{background:#e7f6ee;color:#1c7a4f;}
.dash-month .dmt-routine{background:#eefafd;color:#0e7f9c;}
.dash-month .dmmore{color:var(--sub);font-size:10px;padding-left:2px;}
.wk-mini .ti-meet{background:#f1e9ff;color:#5b3aa8;}
.wk-mini .ti-shared{background:#e7f6ee;color:#1c7a4f;}
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.progress-bar{flex:1;height:8px;background:#edeff5;border-radius:6px;overflow:hidden;}
.progress-bar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .3s;}
.due-item{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;}
.due-item:last-child{border-bottom:none;}
.due-item .t{flex:1;}
.dday{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;}
.dday.over{background:#fdecec;color:var(--danger);}
.dday.soon{background:#fff4e0;color:#b97d0e;}
.dday.later{background:#eef1f6;color:var(--sub);}
.wk-mini{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.wk-mini .cellm{border:1px solid var(--line);border-radius:9px;padding:7px 6px;text-align:left;font-size:12px;cursor:pointer;min-height:110px;}
.wk-mini .cellm:hover{border-color:var(--accent);}
.wk-mini .cellm.today{border-color:var(--accent);background:var(--accent-soft);}
.wk-mini .cellm.off{background:#fbf6ec;}
.wk-mini .cellm b{display:block;font-size:12.5px;text-align:center;margin-bottom:5px;}
.wk-mini .cnt{display:block;text-align:center;color:var(--sub);font-size:11px;margin-bottom:4px;}
.wk-mini .ti{font-size:11.5px;line-height:1.35;padding:2px 4px;border-radius:5px;background:var(--accent-soft);color:var(--accent);
  margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wk-mini .ti.done{background:#eef3ef;color:var(--sub);text-decoration:line-through;}
.wk-mini .cellm.today .ti{background:#fff;}
@media(max-width:900px){.wk-mini{grid-template-columns:repeat(6,minmax(88px,1fr));overflow-x:auto;}}
.routine-line{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
.routine-line:last-child{border-bottom:none;}

/* ===== 업무 리스트 ===== */
ul.task-list{list-style:none;margin:0;padding:0;}
ul.task-list li{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
ul.task-list li:last-child{border-bottom:none;}
.task-check{width:21px;height:21px;min-width:21px;border-radius:7px;border:2px solid #c9cedb;background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
.task-check.done{background:var(--ok);border-color:var(--ok);}
.task-title{flex:1;cursor:pointer;min-width:120px;}
.task-title.done{text-decoration:line-through;color:var(--sub);}
.task-title .note{display:block;font-size:12.5px;color:var(--sub);}
.drag-handle{cursor:grab;color:#c2c7d6;font-size:17px;flex:none;padding:0 4px;touch-action:none;user-select:none;}
.drag-handle:active{cursor:grabbing;}
.dtask.sortable-chosen{background:var(--accent-soft);border-radius:8px;}
.dtask.sortable-ghost{opacity:.35;}
li.routine-fixed .task-check.rf{width:21px;height:21px;min-width:21px;background:#eefafd;border:2px solid #bfe6f0;color:#0e7f9c;font-size:11px;cursor:default;}
li.routine-fixed.rdone .task-check.rf{background:var(--ok);border-color:var(--ok);color:#fff;}
li.routine-fixed.rdone .task-title{text-decoration:line-through;color:var(--sub);}
.chip{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;}
.chip.p-high{background:#fdecec;color:var(--danger);}
.chip.p-mid{background:#fff4e0;color:#b97d0e;}
.chip.p-low{background:#e8f6ef;color:var(--ok);}
.chip.carry{background:var(--accent-soft);color:var(--accent);}
.chip.routine{background:#eefafd;color:#0e7f9c;}
.chip.meet{background:#f1e9ff;color:#7c4dcc;cursor:pointer;}
.chip.event{background:#e7f0ff;color:#2f6fdb;}
.event-inline{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;
  padding:0 10px;background:#fff;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;}
.event-inline input[type=checkbox]{cursor:pointer;margin:0;}
.add-inline{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.add-inline input[type=text]{flex:1;min-width:150px;}
.add-inline select{width:auto;}
.due-inline{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:10px;
  padding:0 8px;background:#fff;font-size:14px;cursor:pointer;}
.due-inline input[type=date]{border:none;padding:8px 2px;width:130px;font-size:13px;}
.day-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.day-nav h2{font-size:18px;margin:0;}
.nav-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer;}
.dayoff-banner{background:#fff7e8;border:1px solid #f3ddb0;color:#8a6d1f;border-radius:10px;
  padding:10px 14px;font-size:13.5px;margin-bottom:12px;}

/* ===== 주간 ===== */
.week-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.week-col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:170px;display:flex;flex-direction:column;}
.week-col.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.week-col.off{background:#fbf6ec;}
.week-col h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:4px;}
.week-col h4 .d{color:var(--sub);font-weight:600;}
.wtask{display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:4px 2px;cursor:pointer;border-radius:6px;}
.wtask:hover{background:var(--accent-soft);}
.wtask .task-check{width:16px;height:16px;min-width:16px;border-radius:5px;font-size:10px;}
.wtask span.t{flex:1;word-break:break-all;}
.wtask span.t.done{text-decoration:line-through;color:var(--sub);}
.week-add{margin-top:auto;border:none;background:transparent;color:var(--sub);font-size:12.5px;cursor:pointer;text-align:left;padding:6px 2px 0;}
.week-add:hover{color:var(--accent);}
.off-tag{font-size:11px;color:#b08a2e;font-weight:700;}

/* ===== 월간 ===== */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.month-grid .dow{text-align:center;font-size:12.5px;font-weight:700;color:var(--sub);padding:4px 0;}
.mcell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;cursor:pointer;font-size:12px;}
.mcell:hover{border-color:var(--accent);}
.mcell.dim{opacity:.4;}
.mcell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.mcell.off{background:#fbf6ec;}
.mcell .dnum{font-weight:700;font-size:12.5px;margin-bottom:3px;display:flex;justify-content:space-between;}
.mcell .mt{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:1px 5px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mcell .mt.done{background:#eef3ef;color:var(--sub);text-decoration:line-through;}
.mcell .mt.routine-mark{background:#eefafd;color:#0e7f9c;}
.mcell .mt.routine-mark.done{background:#eef3ef;color:var(--sub);text-decoration:line-through;}
.mcell .mt.mt-meet{background:#f1e9ff;color:#5b3aa8;}
.mcell .mt.mt-shared{background:#e7f6ee;color:#1c7a4f;}
/* 일간 회의·공동일정 강조 행 */
.ev-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13.5px;}
.ev-row:last-child{margin-bottom:0;}
.ev-meet{background:#f1e9ff;color:#5b3aa8;}
.ev-shared{background:#e7f6ee;color:#1c7a4f;}
.ev-row .ev-time{font-weight:800;font-size:13px;min-width:46px;flex:none;}
.ev-row .ev-title{font-weight:600;}
.ev-row .ev-sub{font-weight:400;opacity:.7;font-size:12px;margin-left:5px;}
.ev-row:hover{filter:brightness(.97);}
/* 주간 회의·공동일정 */
.wev{font-size:12px;padding:4px 7px;border-radius:6px;margin-bottom:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.wev-meet{background:#f1e9ff;color:#5b3aa8;}
.wev-shared{background:#e7f6ee;color:#1c7a4f;}
.mcell .more{color:var(--sub);}

/* ===== 회의록 ===== */
.meet-list{display:flex;flex-direction:column;gap:10px;}
.meet-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;}
.meet-item:hover{border-color:var(--accent);}
.meet-item h4{margin:0 0 4px;font-size:15px;}
.meet-item .meta{font-size:12.5px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.rec-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.2;}}
audio{width:100%;max-width:420px;height:38px;}
.linked-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}

/* ===== 모달 ===== */
.modal-back{position:fixed;inset:0;background:rgba(25,30,45,.45);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.2);}
.modal h3{margin:0 0 16px;font-size:17px;}
.modal label{font-size:13px;font-weight:600;color:var(--sub);display:block;margin:12px 0 5px;}
.modal label.event-check{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--text);}
.modal label.event-check input{margin:0;}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap;}
.modal .foot .left{margin-right:auto;}
.task-pick{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px;}
.task-pick label.pick, label.pick{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:400;color:var(--text);
  margin:0;padding:6px 8px;border-radius:8px;cursor:pointer;}
.task-pick label.pick:hover{background:var(--accent-soft);}
.task-pick input, label.pick input[type=checkbox]{width:auto;}
.dow-picks{display:flex;gap:4px;flex-wrap:wrap;}
.dow-picks button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:13px;color:var(--sub);}
.dow-picks button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.off-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;}
.off-item{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:9px;padding:8px 12px;font-size:14px;}
.off-item .lbl{color:var(--sub);font-size:12.5px;flex:1;}

/* ===== 거래처 ===== */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.contact-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;}
.contact-card:hover{border-color:var(--accent);}
.contact-card h4{margin:0 0 3px;font-size:15px;}
.contact-card .person{font-size:13.5px;color:var(--text);margin-bottom:6px;}
.contact-card .line{font-size:12.5px;color:var(--sub);display:flex;gap:6px;align-items:center;word-break:break-all;}
.contact-card .line a{color:var(--accent);text-decoration:none;}
/* ===== 검색 결과 ===== */
.sr-group{margin-bottom:14px;}
.sr-group h4{margin:0 0 6px;font-size:13px;color:var(--sub);}
.sr-item{padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:center;}
.sr-item:hover{border-color:var(--accent);background:var(--accent-soft);}
.sr-item .m{color:var(--sub);font-size:12px;margin-left:auto;white-space:nowrap;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b3040;color:#fff;
  padding:11px 20px;border-radius:12px;font-size:14px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}

/* ===== 반응형 ===== */
@media(max-width:1200px){
  #app{grid-template-columns:var(--side-w) 1fr;}
  .memo-panel{position:fixed;top:0;right:-320px;width:300px;height:100vh;z-index:70;transition:right .25s;box-shadow:-6px 0 22px rgba(0,0,0,.12);}
  .memo-panel.open{right:0;}
  #memoToggle{display:block;}
  .memo-close{display:inline-flex;}
  /* 태블릿 대시보드 간결화: 긴 메모 숨기고 카드 1열로 */
  #dashTasks .task-title .note{display:none;}
  .dash-grid{grid-template-columns:1fr;}
  .dash-top{grid-template-columns:1fr;}
  .dash-bottom{grid-template-columns:1fr;}
}
@media(max-width:760px){
  #app{display:block;height:auto;}
  .sidebar{position:fixed;bottom:0;left:0;right:0;z-index:50;flex-direction:row;padding:6px 8px;gap:2px;
    border-right:none;border-top:1px solid var(--line);overflow-x:auto;align-items:center;}
  .sidebar .logo,.sidebar .sep,.sidebar .grow{display:none;}
  .snav{padding:8px 10px;font-size:12.5px;flex-direction:column;gap:2px;}
  .snav .ico{font-size:17px;}
  .main-area{padding:14px 12px 130px;}
  .week-grid{grid-template-columns:1fr;}
  .week-col{min-height:auto;}
  .mcell{min-height:64px;font-size:11px;}
  .dash-grid{grid-template-columns:1fr;}
  #memoToggle{bottom:96px;}
}
</style>
</head>

<script>
'use strict';
/* ================= 설정 & 상태 ================= */
const CFG_KEY = 'worktrack_cfg';
// 부서 공용 배포용 기본 접속 정보 — anon/publishable key는 공개용이라 노출돼도 안전(데이터는 RLS로 본인 것만 접근).
// 이 값 덕분에 부서원·새 기기(아이패드 등)는 접속 정보 입력 없이 링크만 열면 바로 로그인 화면으로 감.
const EMBEDDED_CFG = { url: 'https://qdyumevxeqydjniectol.supabase.co', key: 'sb_publishable_XDtpRmUxbY55VHqxcCd1YA_3zaXbW8Q' };
let sb = null, user = null;
let state = { tasks: [], memos: [], meetings: [], daysOff: [], routines: [], contacts: [], weeklyOff: [0, 6], displayName: '', teamMembers: [], isAdmin: false, sharedEvents: [], isTeamMember: false };
let curDate = todayStr();
let curWeekStart = weekStart(todayStr());
let curMonth = todayStr().slice(0, 7);
let daySortable = null;

function getConfig() {
  try {
    const v = JSON.parse(localStorage.getItem(CFG_KEY));
    if (v && v.url && v.key) return v;
  } catch (e) {}
  // localStorage에 저장된 값이 없으면 배포에 심어둔 기본 접속 정보 사용
  return (EMBEDDED_CFG.url && EMBEDDED_CFG.key) ? EMBEDDED_CFG : null;
}
function saveConfig() {
  const url = document.getElementById('cfgUrl').value.trim().replace(/\/+$/, '');
  const key = document.getElementById('cfgKey').value.trim();
  if (!/^https:\/\/.+\.supabase\.co$/.test(url)) return setupErr('URL 형식이 올바르지 않습니다. 예: https://xxxx.supabase.co');
  if (key.length < 30) return setupErr('Anon Key가 너무 짧습니다. 다시 복사해 주세요.');
  localStorage.setItem(CFG_KEY, JSON.stringify({ url, key }));
  location.reload();
}
function setupErr(m) { document.getElementById('setupMsg').textContent = m; }
function resetConfig() {
  if (confirm('Supabase 연결 정보를 지우고 다시 설정할까요? (데이터는 삭제되지 않습니다)')) {
    localStorage.removeItem(CFG_KEY); location.reload();
  }
}

/* ================= 날짜 유틸 ================= */
function todayStr() { return toYMD(new Date()); }
function toYMD(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function addDays(ymd, n) { const d = new Date(ymd + 'T00:00:00'); d.setDate(d.getDate() + n); return toYMD(d); }
function dowOf(ymd) { return new Date(ymd + 'T00:00:00').getDay(); }
function weekStart(ymd) { const dow = dowOf(ymd); return addDays(ymd, dow === 0 ? -6 : 1 - dow); }
const DOW_KO = ['일', '월', '화', '수', '목', '금', '토'];
function fmtKo(ymd) {
  const [y, m, d] = ymd.split('-');
  return `${Number(m)}월 ${Number(d)}일 (${DOW_KO[dowOf(ymd)]})`;
}
function diffDays(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ================= 휴무일 로직 ================= */
function isDayOff(ymd) {
  if (state.weeklyOff.includes(dowOf(ymd))) return true;
  return state.daysOff.some(o => o.date === ymd);
}
function dayOffLabel(ymd) {
  const o = state.daysOff.find(o => o.date === ymd);
  if (o) return o.label || '휴무';
  if (state.weeklyOff.includes(dowOf(ymd))) return `매주 ${DOW_KO[dowOf(ymd)]}요일 휴무`;
  return '';
}
function nextWorkday(ymd) {
  let d = ymd;
  for (let i = 0; i < 60; i++) { if (!isDayOff(d)) return d; d = addDays(d, 1); }
  return ymd;
}

/* ================= 초기화 & 인증 ================= */
async function init() {
  const cfg = getConfig();
  if (!cfg) { show('setupScreen'); return; }
  try { sb = window.supabase.createClient(cfg.url, cfg.key); }
  catch (e) { localStorage.removeItem(CFG_KEY); show('setupScreen'); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('loginScreen'); return; }
  user = session.user;
  await startApp();
}
function show(id) {
  ['setupScreen', 'loginScreen', 'app'].forEach(x => document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPw').value;
  if (!email || !pw) return loginMsg('이메일과 비밀번호를 입력하세요.', true);
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) return loginMsg('로그인 실패: ' + koAuthErr(error.message), true);
  user = data.user; await startApp();
}
async function doSignup() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPw').value;
  if (!email || pw.length < 6) return loginMsg('이메일과 6자 이상 비밀번호를 입력하세요.', true);
  const { data, error } = await sb.auth.signUp({ email, password: pw });
  if (error) return loginMsg('가입 실패: ' + koAuthErr(error.message), true);
  if (data.session) { user = data.user; await startApp(); }
  else loginMsg('가입 완료! 이메일 인증 메일을 확인한 뒤 로그인하세요.', false);
}
async function doLogout() { await sb.auth.signOut(); location.reload(); }
function loginMsg(m, isErr) {
  const el = document.getElementById('loginMsg');
  el.textContent = m; el.className = 'auth-msg ' + (isErr ? 'err' : 'ok');
}
function koAuthErr(m) {
  if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 올바르지 않습니다.';
  if (/already registered/i.test(m)) return '이미 가입된 이메일입니다.';
  if (/rate limit/i.test(m)) return '시도가 너무 잦습니다. 잠시 후 다시 시도하세요.';
  return m;
}

/* ================= 데이터 로드 · 이월 · 고정업무 ================= */
async function startApp() {
  show('app');
  document.getElementById('topDate').textContent = '📅 ' + fmtKo(todayStr());
  await loadAll();
  await ensureRoutineTasks(); // 주기 도래분 생성 (지난 것 포함)
  await rolloverTasks();      // 지난 미완료분을 오늘로 이월
  updateLogo();               // 사이드바에 내 표시 이름 반영
  renderAll();
}
async function loadAll() {
  const [t, m, mt, off, rt, ct, st, tm, se] = await Promise.all([
    sb.from('tasks').select('*').order('sort').order('created_at'),
    sb.from('memos').select('*').order('pinned', { ascending: false }).order('updated_at', { ascending: false }),
    sb.from('meetings').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('days_off').select('*').order('date'),
    sb.from('routines').select('*').order('created_at'),
    sb.from('contacts').select('*').order('company'),
    sb.from('settings').select('*').maybeSingle(),
    sb.from('team_members').select('*').order('email'),
    sb.from('shared_events').select('*'),
  ]);
  for (const r of [t, m, mt, off, rt, ct]) {
    if (r.error) { toast('데이터 로드 오류: ' + r.error.message); console.error(r.error); }

/* 날짜별 회의·공동일정 (시간순) */
function meetingsOf(ymd) { return state.meetings.filter(m => m.date === ymd).sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1); }
function sharedOf(ymd) { return state.sharedEvents.filter(e => e.date === ymd).sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1); }
async function rolloverTasks() {
  const target = nextWorkday(todayStr());
  // 일정(is_event)은 특정 날짜에 고정되므로 자동이월에서 제외
  const stale = state.tasks.filter(t => !t.done && t.date < todayStr() && !t.is_event);
  if (!stale.length) return;
  const ids = stale.map(t => t.id);
  const { error } = await sb.from('tasks').update({ date: target, carried_over: 1 }).in('id', ids);
  if (error) { toast('이월 처리 오류: ' + error.message); return; }
  stale.forEach(t => { t.date = target; t.carried_over = 1; });
  toast(`미완료 업무 ${stale.length}건을 ${fmtKo(target)}로 이월했어요.`);
}
/* ----- 고정 업무 주기 계산 ----- */
const REPEATS = ['매일', '매주', '2주마다', '매월'];
// 매월: 기준일과 같은 '일(day)'로, 짧은 달은 말일로 보정
function monthlyDue(anchor, today) {
  const dayN = Number(anchor.slice(8, 10));
  const mk = (y, m) => {
    const last = new Date(y, m, 0).getDate();
    return `${y}-${String(m).padStart(2, '0')}-${String(Math.min(dayN, last)).padStart(2, '0')}`;
  };
  let [y, m] = today.split('-').map(Number);
  let cand = mk(y, m);
  if (cand > today) { m--; if (m === 0) { m = 12; y--; } cand = mk(y, m); }
  return cand >= anchor ? cand : null;
}
// 오늘 기준, 가장 최근에 도래한(<=오늘) 발생일. 없으면 null
function latestDue(r, today) {
  const rep = r.repeat_every || '매일';
  if (rep === '매일') return isDayOff(today) ? null : today;
  const anchor = r.anchor_date || (r.created_at || today).slice(0, 10);
  if (anchor > today) return null;
  if (rep === '매월') return monthlyDue(anchor, today);
  const step = rep === '2주마다' ? 14 : 7;
  return addDays(anchor, Math.floor(diffDays(anchor, today) / step) * step);
}
// 오늘 이후(오늘 포함) 첫 발생일 — 목록 표시에 사용
function nextOccurrence(r) {
  const today = todayStr();
  const rep = r.repeat_every || '매일';
  if (rep === '매일') return null;
  const anchor = r.anchor_date || today;
  if (anchor >= today) return anchor;
  for (let i = 0; i < 62; i++) {
    const d = addDays(today, i);
    if (rep === '매월') { if (monthlyDue(anchor, d) === d) return d; }
    else {
      const step = rep === '2주마다' ? 14 : 7;
      if (diffDays(anchor, d) % step === 0) return d;
    }
  }
  return null;
}
// 특정 날짜에 반복 고정업무(매일 제외)가 도래하는지 — 월간 캘린더 예정 표시용
function monthlyOccursOn(anchor, ymd) {
  const dayN = Number(anchor.slice(8, 10));
  const [y, m] = ymd.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  return Number(ymd.slice(8, 10)) === Math.min(dayN, last);
}
function routineOccursOn(r, ymd) {
  const rep = r.repeat_every || '매일';
  if (rep === '매일') return false;            // 매일 반복은 캘린더 표시 제외
  const anchor = r.anchor_date || (r.created_at || '').slice(0, 10);
  if (!anchor || ymd < anchor) return false;
  if (rep === '매월') return monthlyOccursOn(anchor, ymd);
  const step = rep === '2주마다' ? 14 : 7;
  return diffDays(anchor, ymd) % step === 0;
}
// 주기가 도래한 고정 업무를 자동 생성 (앱을 열 때 실행)
async function ensureRoutineTasks() {
  const today = todayStr();
  for (const r of state.routines.filter(r => r.active)) {
    const due = latestDue(r, today);
    if (!due) continue;
    if (r.last_generated && r.last_generated >= due) continue;
    const target = nextWorkday(due);
    // 같은 주기분이 이미 있거나, 이전 분이 아직 미완료로 남아있으면 중복 생성하지 않음
    const dupToday = state.tasks.some(t => t.routine_id === r.id && t.date === target);
    const pendingOld = state.tasks.some(t => t.routine_id === r.id && !t.done && t.date >= today);
    if (!dupToday && !pendingOld) {
      const { data, error } = await sb.from('tasks').insert({
        user_id: user.id, title: r.title, date: target, priority: r.priority,
        done: false, note: '', carried_over: due < today ? 1 : 0, routine_id: r.id,
      }).select().single();
      if (error) { toast('고정 업무 생성 오류: ' + error.message); continue; }
      state.tasks.push(data);
    }
    const { error: e2 } = await sb.from('routines').update({ last_generated: due }).eq('id', r.id);
    if (!e2) r.last_generated = due;
  }
}

/* ================= 공통: 업무 조작 ================= */
function tasksOf(ymd) { return state.tasks.filter(t => t.date === ymd); }
function priOrder(p) { return p === '높음' ? 0 : p === '중간' ? 1 : 2; }
// 정렬: 미완료 우선 → 수동 순서(sort) → 우선순위
function taskSort(a, b) { return (a.done - b.done) || ((a.sort || 0) - (b.sort || 0)) || (priOrder(a.priority) - priOrder(b.priority)); }
function priChip(p) {
  const cls = p === '높음' ? 'p-high' : p === '중간' ? 'p-mid' : 'p-low';
  return `<span class="chip ${cls}">${esc(p)}</span>`;
}
function ddayChip(due) {
  if (!due) return '';
  const n = diffDays(todayStr(), due);
  const cls = n <= 0 ? 'over' : n <= 3 ? 'soon' : 'later';
  const label = n < 0 ? `D+${-n}` : n === 0 ? 'D-DAY' : `D-${n}`;
  return `<span class="dday ${cls}" title="마감 ${fmtKo(due)}">⏰ ${label}</span>`;
}
// isEvent=true(일정): 휴무일에도 그 날짜에 그대로 등록, 자동이월 대상에서 제외
async function createTask(title, ymd, priority, dueDate, isEvent = false) {
  let date = ymd, moved = false;
  // 일정은 날짜 이동 없음. 일반 업무만 휴무일이면 다음 근무일로 이동
  if (!isEvent && isDayOff(ymd)) { date = nextWorkday(ymd); moved = date !== ymd; }
  const maxSort = state.tasks.filter(x => x.date === date && !x.done).reduce((m, x) => Math.max(m, x.sort || 0), 0);
  const { data, error } = await sb.from('tasks')
    .insert({ user_id: user.id, title, date, priority, done: false, note: '', carried_over: 0, due_date: dueDate || null, is_event: isEvent, sort: maxSort + 1 })
    .select().single();
  if (error) return toast('추가 실패: ' + error.message);
  state.tasks.push(data);
  if (isEvent) toast(`📅 ${fmtKo(date)}에 일정을 등록했어요.`);
  else if (moved) toast(`${fmtKo(ymd)}은(는) 휴무일이라 ${fmtKo(date)}에 배정했어요.`);
  renderAll();
}

// 일간 업무 수동 순서 이동 (dir: -1 위로, 1 아래로) — 같은 날 미완료 목록 안에서
async function moveTask(id, dir) {
  const t = state.tasks.find(x => x.id === id); if (!t) return;
  const list = tasksOf(t.date).filter(x => !x.done).sort(taskSort);
  const i = list.findIndex(x => x.id === id);
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  const changed = [];
  list.forEach((x, k) => { if ((x.sort || 0) !== k) { x.sort = k; changed.push(x); } });
  renderAll();
  for (const x of changed) { await sb.from('tasks').update({ sort: x.sort }).eq('id', x.id); }
}

    const items = meetingsOf(d).map(mm => `<div class="dmt dmt-meet">🎙️${mm.time ? esc(mm.time) + ' ' : ''}${esc(mm.title)}</div>`)

      .concat(rOcc.map(r => `<div class="dmt dmt-routine${routineOccurrenceDone(r, d) ? ' done' : ''}">🔁${esc(r.title)}</div>`))
      .concat(ts.map(t => `<div class="dmt${t.done ? ' done' : ''}">${esc(t.title)}</div>`));

}

/* ================= 일간 ================= */
function moveDay(n) { curDate = addDays(curDate, n); renderDay(); }
function goToday() { curDate = todayStr(); renderDay(); }
// 이 날 도래하는 고정업무 판정 (일간 표시용, 매일 포함)
function routineOccursOnDay(r, ymd) {
  const rep = r.repeat_every || '매일';
  if (rep === '매일') return !isDayOff(ymd);
  return routineOccursOn(r, ymd);
}
// 이 반복 주기분이 (다른 날로 이월돼서라도) 완료됐는지 → 완료 시 예정 표시에 취소선
function routineOccurrenceDone(r, ymd) {
  const rep = r.repeat_every || '매일';
  let nextOcc;
  if (rep === '매주') nextOcc = addDays(ymd, 7);
  else if (rep === '2주마다') nextOcc = addDays(ymd, 14);
  else if (rep === '매월') {
    const [y, m] = ymd.split('-').map(Number);
    const dayN = Number((r.anchor_date || ymd).slice(8, 10));
    const ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1;
    const last = new Date(ny, nm, 0).getDate();
    nextOcc = `${ny}-${String(nm).padStart(2, '0')}-${String(Math.min(dayN, last)).padStart(2, '0')}`;
  } else return false;
  return state.tasks.some(t => t.routine_id === r.id && t.done && t.date >= ymd && t.date < nextOcc);
}
function routineLi(r, ymd) {
  const done = routineOccurrenceDone(r, ymd);
  const li = document.createElement('li');
  li.className = 'routine-fixed' + (done ? ' rdone' : '');
  li.innerHTML = `
    <div class="task-check rf" title="고정 업무 (이 날 예정)">${done ? '✓' : '🔁'}</div>
    <div class="task-title">${esc(r.title)}<span class="note">고정 업무 · ${esc(r.repeat_every || '매일')}${done ? ' · 완료' : ''}</span></div>
    <span class="chip routine">🔁 고정</span>`;
  return li;
}
// 드래그로 바뀐 일간 순서를 sort에 저장
async function saveDayOrder() {
  const ids = [...document.querySelectorAll('#dayTasks .dtask')].map(li => li.dataset.id);
  const changed = [];
  ids.forEach((id, k) => { const t = state.tasks.find(x => x.id === id); if (t && (t.sort || 0) !== k) { t.sort = k; changed.push(t); } });
  for (const t of changed) { await sb.from('tasks').update({ sort: t.sort }).eq('id', t.id); }
}
function renderDay() {

  const rOcc = state.routines.filter(r => r.active && routineOccursOnDay(r, curDate) && !list.some(t => t.routine_id === r.id));

}

/* ================= 월간 ================= */
function moveMonth(n) {
  const [y, m] = curMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  curMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  renderMonth();
}
function goThisMonth() { curMonth = todayStr().slice(0, 7); renderMonth(); }
function renderMonth() {
  const [y, m] = curMonth.split('-').map(Number);
  document.getElementById('monthTitle').textContent = `${y}년 ${m}월`;
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = ['월', '화', '수', '목', '금', '토', '일'].map(d => `<div class="dow">${d}</div>`).join('');
  const first = `${curMonth}-01`;
  let d = weekStart(first);
  const lastDay = new Date(y, m, 0).getDate();
  const last = `${curMonth}-${String(lastDay).padStart(2, '0')}`;
  while (true) {
    if (d > last && dowOf(d) === 1) break;
    const cell = document.createElement('div');
    const inMonth = d.slice(0, 7) === curMonth;
    const off = isDayOff(d);
    cell.className = 'mcell' + (inMonth ? '' : ' dim') + (d === todayStr() ? ' today' : '') + (off ? ' off' : '');
    const ts = tasksOf(d);
    // 반복 고정업무(매주/2주/매월) 예정 표시 — 아직 생성 안 된 도래분만(중복 방지)
    const rOcc = state.routines.filter(r => r.active && r.show_on_calendar !== false && routineOccursOn(r, d) && !ts.some(t => t.routine_id === r.id));
    let html = `<div class="dnum"><span>${Number(d.slice(8))}</span>${off ? '<span>🏖️</span>' : ''}</div>`;
    // 셀 상단: 회의(보라)·공동일정(초록) → 반복 → 실제 업무
    const mItems = meetingsOf(d).map(mm => `<div class="mt mt-meet">🎙️ ${mm.time ? esc(mm.time) + ' ' : ''}${esc(mm.title)}</div>`)
      .concat(sharedOf(d).map(ev => `<div class="mt mt-shared">👥 ${ev.time ? esc(ev.time) + ' ' : ''}${esc(ev.title)}</div>`))
      .concat(rOcc.map(r => `<div class="mt routine-mark${routineOccurrenceDone(r, d) ? ' done' : ''}">🔁 ${esc(r.title)}</div>`))
      .concat(ts.map(t => `<div class="mt ${t.done ? 'done' : ''}">${esc(t.title)}</div>`));
    mItems.slice(0, 4).forEach(h => html += h);
    if (mItems.length > 4) html += `<div class="more">+${mItems.length - 4}건 더</div>`;
    cell.innerHTML = html;
    const dd = d;
    cell.onclick = () => { curDate = dd; switchView('day'); };
    grid.appendChild(cell);
    d = addDays(d, 1);
  }
}

let mediaRecorder = null, recChunks = [], recBlob = null, recTimer = null, recSec = 0;

    .filter(t => t.date >= addDays(todayStr(), -30))

  const pickHtml = candidates.length ? candidates.map(t => `

async function loadAudio(path) {

  const box = document.getElementById('audioBox'); if (!box) return;
  if (error) { box.innerHTML = '<div class="muted">녹음 파일을 불러오지 못했어요.</div>'; return; }

}
async function toggleRec() {
  const btn = document.getElementById('recBtn');
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = []; recSec = 0;
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
      : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
    mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      recBlob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      clearInterval(recTimer);
      const dot = document.getElementById('recDot'); if (dot) dot.remove();
      btn.textContent = '● 다시 녹음';
      document.getElementById('recTime').textContent = `녹음 완료 (${fmtSec(recSec)}) — 저장을 눌러야 업로드됩니다`;
      document.getElementById('audioBox').innerHTML = `<audio controls src="${URL.createObjectURL(recBlob)}"></audio>`;
    };
    mediaRecorder.start();
    btn.innerHTML = '⏹ 녹음 중지';
    document.getElementById('recBox').insertAdjacentHTML('afterbegin', '<span class="rec-dot" id="recDot"></span>');
    recTimer = setInterval(() => {
      recSec++; const el = document.getElementById('recTime');
      if (el) el.textContent = '녹음 중… ' + fmtSec(recSec);
    }, 1000);
  } catch (e) {
    toast('마이크 권한이 필요해요. 브라우저 설정에서 마이크를 허용해 주세요.');
  }
}
function stopRecCleanup() {
  if (mediaRecorder && mediaRecorder.state === 'recording') { try { mediaRecorder.stop(); } catch (e) {} }
  clearInterval(recTimer); mediaRecorder = null;
}
function fmtSec(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
async function saveMeeting(id) {

  const date = document.getElementById('mtDate').value || todayStr();
  const content = document.getElementById('mtContent').value.trim();
  const task_ids = [...document.querySelectorAll('#mtPick input:checked')].map(c => c.dataset.tid);
  let audio_path = id ? (state.meetings.find(x => x.id === id)?.audio_path || null) : null;
  if (recBlob) {
    toast('녹음 업로드 중…');
    const ext = recBlob.type.includes('mp4') ? 'm4a' : 'webm';
    const path = `${user.id}/${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('recordings')
      .upload(path, recBlob, { contentType: recBlob.type, upsert: false });
    if (upErr) return toast('녹음 업로드 실패: ' + upErr.message);
    if (audio_path) await sb.storage.from('recordings').remove([audio_path]);

  let error, data;
  if (id) ({ error } = await sb.from('meetings').update(row).eq('id', id));

  if (error) return toast('저장 실패: ' + error.message);

  else state.meetings.unshift(data);

    <label>이메일</label><input id="ctEmail" type="email" value="${c ? esc(c.email || '') : ''}" placeholder="예: contact@company.com">
    <label>메모</label><textarea id="ctNote" rows="3" placeholder="거래 내용, 특이사항 등">${c ? esc(c.note || '') : ''}</textarea>
    <div class="foot">
      ${c ? `<button class="btn danger left" onclick="delContact('${c.id}')">삭제</button>` : ''}
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn" onclick="saveContact(${c ? `'${c.id}'` : 'null'})">저장</button>
    </div>`);
}
async function saveContact(id) {
  const company = document.getElementById('ctCompany').value.trim();
  if (!company) return toast('거래처명을 입력하세요.');
  const row = {
    user_id: user.id, company,
    category: document.getElementById('ctCategory').value.trim(),
    person: document.getElementById('ctPerson').value.trim(),
    phone: document.getElementById('ctPhone').value.trim(),
    email: document.getElementById('ctEmail').value.trim(),
    note: document.getElementById('ctNote').value.trim(),
  };
  let error, data;
  if (id) ({ error } = await sb.from('contacts').update(row).eq('id', id));
  else ({ data, error } = await sb.from('contacts').insert(row).select().single());
  // DB에 category 컬럼이 아직 없으면 카테고리 없이 재시도 (마이그레이션 전 호환)
  if (error && /category/i.test(error.message)) {
    delete row.category;
    if (id) ({ error } = await sb.from('contacts').update(row).eq('id', id));
    else ({ data, error } = await sb.from('contacts').insert(row).select().single());
    if (!error) toast('저장됐어요. (카테고리는 DB 준비 후 저장됩니다)');
  }
  if (error) return toast('저장 실패: ' + error.message);
  if (id) Object.assign(state.contacts.find(x => x.id === id), row);
  else state.contacts.push(data);
  state.contacts.sort((a, b) => (a.company || '').localeCompare(b.company || '', 'ko'));
  closeModal(); renderContacts(); toast('거래처가 저장됐어요.');
}
async function delContact(id) {
  if (!confirm('이 거래처를 삭제할까요?')) return;
  const { error } = await sb.from('contacts').delete().eq('id', id);
  if (error) return toast('삭제 실패: ' + error.message);
  state.contacts = state.contacts.filter(x => x.id !== id);
  closeModal(); renderContacts();
}

/* ================= 통합 검색 ================= */
function doSearch() {
  const q = document.getElementById('globalSearch').value.trim().toLowerCase();
  if (!q) return;
  const hit = v => (v || '').toLowerCase().includes(q);
  const tasks = state.tasks.filter(t => hit(t.title) || hit(t.note)).slice(0, 15);
  const memos = state.memos.filter(m => hit(m.content)).slice(0, 10);
  const meetings = state.meetings.filter(m => hit(m.title) || hit(m.content)).slice(0, 10);
  const contacts = state.contacts.filter(c => [c.company, c.person, c.phone, c.email, c.note].some(hit)).slice(0, 10);
  const total = tasks.length + memos.length + meetings.length + contacts.length;
  let html = `<h3>🔍 "${esc(q)}" 검색 결과 (${total}건)</h3>`;
  if (!total) html += '<div class="muted">검색 결과가 없어요.</div>';
  if (tasks.length) {
    html += `<div class="sr-group"><h4>📋 업무 (${tasks.length})</h4>` + tasks.map(t =>
      `<div class="sr-item" onclick="closeModal();openTaskModal('${t.id}')">
        <span>${t.done ? '✅' : '⬜'} ${esc(t.title)}</span><span class="m">${fmtKo(t.date)}</span></div>`).join('') + '</div>';
  }
  if (meetings.length) {
    html += `<div class="sr-group"><h4>🎙️ 회의록 (${meetings.length})</h4>` + meetings.map(m =>
      `<div class="sr-item" onclick="closeModal();openMeetingModal('${m.id}')">
        <span>${esc(m.title)}</span><span class="m">${fmtKo(m.date)}</span></div>`).join('') + '</div>';
  }
  if (memos.length) {
    html += `<div class="sr-group"><h4>📝 메모 (${memos.length})</h4>` + memos.map(m =>
      `<div class="sr-item" onclick="closeModal();editMemo('${m.id}')">
        <span>${esc(m.content.slice(0, 60))}${m.content.length > 60 ? '…' : ''}</span>
        <span class="m">${(m.category || '개인')}</span></div>`).join('') + '</div>';
  }
  if (contacts.length) {
    html += `<div class="sr-group"><h4>📇 거래처 (${contacts.length})</h4>` + contacts.map(c =>
      `<div class="sr-item" onclick="closeModal();openContactModal('${c.id}')">
        <span>🏢 ${esc(c.company)}${c.person ? ' · ' + esc(c.person) : ''}</span>
        <span class="m">${esc(c.phone || '')}</span></div>`).join('') + '</div>';
  }
  html += '<div class="foot"><button class="btn" onclick="closeModal()">닫기</button></div>';
  openModal(html);
}

/* ================= 모달 & 토스트 ================= */
function openModal(html) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() { stopRecCleanup(); document.getElementById('modalRoot').innerHTML = ''; }
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
</body>
</html>
