name: Radar cloud daily collection
on:
  workflow_dispatch:
  schedule:
    # 00:30 UTC = 09:30 Asia/Seoul; GitHub may start scheduled jobs late.
    - cron: '30 0 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: radar-cloud-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Collect and save missing answers
        run: xvfb-run --auto-servernum node collect.mjs
        env:
          HEADED: 'true'
      - name: Save collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-cloud-collection-${{ github.run_id }}
          path: cloud/output/
          retention-days: 3
          if-no-files-found: warn
